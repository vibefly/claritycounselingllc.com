<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — Clarity Counseling LLC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:              #FAF9F7;
      --bg-alt:          #F2EEE9;
      --accent-primary:  #7C6E64;
      --accent-light:    #EDE6DE;
      --accent-secondary:#B5A89A;
      --text-primary:    #2C2825;
      --text-secondary:  #7C6E64;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      overflow: hidden;
    }

    /* Background shapes */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
    }
    body::before {
      width: 600px; height: 600px;
      background: radial-gradient(circle, var(--accent-light) 0%, transparent 70%);
      top: -180px; right: -120px;
      opacity: 0.6;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, var(--accent-secondary) 0%, transparent 70%);
      bottom: -140px; left: -100px;
      opacity: 0.2;
    }

    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 520px;
      width: 100%;
      padding: 3.5rem 3rem;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--accent-light);
      border-radius: 28px;
      box-shadow: 0 8px 40px rgba(44,40,37,0.08);
    }

    .emblem {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.75rem;
    }

    .emblem svg {
      width: 28px;
      height: 28px;
      stroke: var(--accent-primary);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-primary);
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 300;
      line-height: 1.15;
      color: var(--text-primary);
      margin-bottom: 0.3rem;
    }

    h1 em {
      font-style: italic;
      color: var(--accent-primary);
    }

    .business-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      font-style: italic;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: var(--accent-secondary);
      margin: 1.5rem auto;
      opacity: 0.6;
    }

    p {
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--text-secondary);
      max-width: 380px;
      margin-inline: auto;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 2.5rem;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-secondary);
      animation: pulse 1.6s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.3s; }
    .dot:nth-child(3) { animation-delay: 0.6s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.25); }
    }

    @media (max-width: 480px) {
      .card { padding: 2.5rem 1.75rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emblem">
      <!-- heart-pulse icon -->
      <svg viewBox="0 0 24 24">
        <path d="M3.34 7a6 6 0 0 1 10.66 0M8 13l2-3 2 4 2-2h2"/>
        <path d="M20.66 7A6 6 0 0 1 12 19.66 6 6 0 0 1 3.34 7"/>
      </svg>
    </div>
    <p class="label">Coming Soon</p>
    <h1>Something <em>healing</em><br>is on the way</h1>
    <div class="business-name">Clarity Counseling LLC</div>
    <div class="divider"></div>
    <p>A new practice website is being thoughtfully prepared. Please check back soon — or reach out directly to schedule an appointment.</p>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
